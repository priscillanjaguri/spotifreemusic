# Production-shaped stack: Postgres + Spotifree (API serving the built SPA).
# Copy .env.example → .env and fill SECRET_KEY (+ optional Jamendo / R2). Never commit .env.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: spotifree
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spotifree}
      POSTGRES_DB: spotifree
    volumes:
      - spotifree_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spotifree -d spotifree"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "${SPOTIFREE_PORT:-8000}:8000"
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://spotifree:${POSTGRES_PASSWORD:-spotifree}@db:5432/spotifree
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:8000"]}
      JAMENDO_CLIENT_ID: ${JAMENDO_CLIENT_ID:-}
      DEV_MOCK_PROVIDER: "false"
      LIBRARY_ANALYSIS_ENABLED: ${LIBRARY_ANALYSIS_ENABLED:-false}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      FRONTEND_DIST: /app/frontend/dist
    volumes:
      - spotifree_library:/app/var/library
    depends_on:
      db:
        condition: service_healthy

volumes:
  spotifree_pg:
  spotifree_library:
